<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Support - Yementi Hosted Services</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', system-ui, sans-serif; 
            background: #f0f2f5; 
            color: #050505;
            min-height: 100vh; padding: 40px 20px; display: flex; align-items: center; justify-content: center; 
        }
        
        .contact-container { 
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 12px rgba(0,0,0,.1);
            padding: 40px 30px;
            max-width: 580px; width: 100%; text-align: center;
        }

        .logo { font-size: 28px; margin-bottom: 16px; color: #1877f2; font-weight: bold; }
        
        h1 { color: #050505; margin-bottom: 20px; font-size: 26px; }
        
        p { color: #636363; line-height: 1.6; margin-bottom: 12px; }

        .status-box { 
            background: rgba(24,119,242,.08);
            padding: 20px 18px; border-radius: 8px; margin-bottom: 20px; text-align: center;
        }
        .status-box h3 { color: #050505; font-size: 17px; margin-bottom: 8px; }
        .status-box p { color: #636363; font-size: 14px; }

        .contact-methods { display: grid; gap: 12px; text-align: left; }
        
        .contact-item { 
            background: white; 
            padding: 18px 16px; 
            border-radius: 6px; 
            text-align: center; 
            transition: all .2s ease; 
            cursor: pointer;
            border: 1px solid #e4e6eb;
        }
        
        .contact-item:hover { 
            background: rgba(24,119,242,.05);
            border-color: #1877f2;
            transform: translateY(-1px);
        }

        .contact-icon { font-size: 28px; margin-bottom: 8px; }
        
        .contact-label { font-weight: 600; color: #050505; font-size: 14px; }
        
        .contact-value { font-size: 13px; color: #8E8E93; }

        .links-container { display: flex; justify-content: center; gap: 12px; margin-top: 20px; flex-wrap: wrap; }
        
        .links-container a { 
            color: #1877f2; 
            background: rgba(24,119,242,.08); 
            padding: 10px 18px; 
            border-radius: 6px; 
            text-decoration: none; 
            font-weight: 500; 
            font-size: 13px;
            transition: all .2s;
        }

        .links-container a:hover { background: rgba(24,119,242,.16); }

        footer { margin-top:25px;padding:12px 0;border-top:1px solid #dddfe2;}
    </style>
</head>
<body>
    <div class="contact-container">
        
        <div class="status-box">
            <h3>🎉 Connected!</h3>
            <p>Your contact information and support channels are ready.</p>
        </div>

        <h1>Contact us</h1>
        
        <p>We're here to help! Reach out through your preferred method:</p>

        <div class="contact-methods">
            <div class="contact-item" onclick="window.location.href='mailto:support@yementi-hosted.com'">
                <div class="contact-icon">✉️</div>
                <div class="contact-label">Email Support</div>
                <div class="contact-value">support@yementi-hosted.com</div>
            </div>

            <div class="contact-item" onclick="window.location.href='https://yementi-hosted.zendesk.com/hc/en-us/requests/new'">
                <div class="contact-icon">🎫</div>
                <div class="contact-label">Submit Ticket</div>
                <div class="contact-value">Help Center →</div>
            </div>

            <div class="contact-item" onclick="window.open('https://www.facebook.com/Yementi', '_blank')">
                <div class="contact-icon">📘</div>
                <div class="contact-label">Facebook Page</div>
                <div class="contact-value">Official Yementi page</div>
            </div>
        </div>

    </div>

    <footer style="margin-top:25px;padding:12px 0;border-top:1px solid #dddfe2;box-sizing:border-box;">
        <p style="font-size:12px;color:#8E8E93;">&copy; 2026 Yementi.io - All rights reserved.</p>
    </footer>

</body>
</html>
