<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Yementi.io - Where Tomorrow Begins Today</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&family=Playfair+Display:ital,wght@0,700;1,400&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}body{font-family:"Poppins",sans-serif;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);min-height:100vh;color:white;display:flex;flex-direction:column;align-items:center;overflow-x:hidden}
.glowtext{background:linear-gradient(90deg, #ff6b6b,#feca57,#48dbfb,#ff9ff3,-webkit-linear-gradient(90deg, #ff6b6b,#feca57,#48dbfb,#ff9ff3));-webkit-background-clip:text;background-clip:text;webkit-text-fill-color:transparent;font-size:3.5rem;animation:pulse 3s ease-in-out infinite;margin:20px 0}
@keyframes pulse{0%{transform:scale(1);text-shadow:0 0 20px rgba(255,107,107,.4)}30%{transform:scale(1.02),text-shadow:0 0 30px rgba(255,107,107,.6)}100%{transform:scale(1);text-shadow:0 0 20px rgba(255,107,107,.4)}}
.tabs{position:fixed;right:-80px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;background:rgba(255,255,255,.1);border-radius:.5rem;padding:2rem;border:1px solid rgba(255,255,255,.2);width:180px;z-index:999;transition:.3s}
.tab{padding:1.2rem 1.5rem;margin-bottom:.5rem;width:auto;display:flex;align-items:center;font-size:1.1rem;font-weight:600;cursor:pointer;border:1px solid transparent;color:white;background:rgba(255,255,255,.1);border-radius:.5rem;position:relative}
.tab::before{content:"";position:absolute;left:-8px;top:50%;transform:translate(-50%,-50%) scaleX(0);width:36px;height:36px;background:white;border-radius:50%;transition:.4s;will-change:left,transform}
.tab::after{content:"";position:absolute;left:-7px;top:82%;transform:scale(0) rotate(-135deg);width:36px;height:36px;background:white;border-radius:50%;transition:.5s;will-change:transform,opacity}
.tab:hover,.tab:active{background:hsla(149,76%,62%,.2)}
.tab:hover::before{left:calc(-8px + 2rem);width:calc(36px - 2rem);height:36px;transform:translate(-50%,-50%) scaleX(1)}
.tab:hover::after{transform:rotate(0) scale(1);opacity:1;left:.8rem;transition:.4s}
</style>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.11.4/dist/gsap.min.js"></script><script>window.addEventListener("load",()=>{gsap.from(".glowtext",{duration:.8,yoyo:true,repeat:-1})});</script></head>
<body>
<div class="tab" data-target="#home"><span>Home</span></div>
<div class="tab"data-target="#about"><span>About</span></div>
<div class="tab"data-target="#contact"><span>Contact</span></div>
<main id="home"><h1 class="glowtext">FUTURE IS NOW</h1><p style="font-size:(2rem;max-width:600px;text-align:center;margin:20px 0;">Yementi.io - Where Tomorrow Begins Today</p><div style="margin-top:40px;font-size:3.5rem;">🚀 💻 ✨</div></main>
<div id="about" style="display:none;max-width:800px;margin-bottom:20px;">This is a futuristic website with smooth scroll animations and glassmorphism effects built with modern CSS.</div><div id="contact"style="display:none"><a href="mailto:hello@yementi.io" style="font-size:1.5rem;text-decoration:none;color:white;">hello@yementi.io</a></div>
<script>window.addEventListener("load",()=>{const tabs=document.querySelectorAll(".tab");tabs.forEach(t=>t.onclick=()=>{document.querySelectorAll("main,#home").innerHTML="#contact")}{const targets=document.querySelectorAll(".about","#about")[0],(contacts="#contact"),id);target.style.display=t.dataset.target===targetId?"block":"none";});</script>
