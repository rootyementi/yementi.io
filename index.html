<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Yementi.io - Premium Cloud Hosting</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;500;700&amp;display=swap" rel="stylesheet">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Rajdhani', sans-serif; background: linear-gradient(135deg, #0a0a2e, #1a1a4e); color: white; overflow-x: hidden; cursor: default; }
    
    :root { --primary: #6366f1; --secondary: #8b5cf6; --accent: #ec4899; --gradient: linear-gradient(135deg, var(--primary), var(--accent)); }
    
    .particles { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
    .particle { position: absolute; width: 12px; height: 12px; border-radius: 50%; background: var(--primary); opacity: 0.3; animation: float 20s ease-in-out infinite; }
    
    .hero { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; overflow: hidden; padding: 80px 20px; }
    
    .glitch-title { font-family: 'Orbitron', sans-serif; font-size: clamp(3rem, 10vw, 7rem); text-align: center; line-height: 1.1; margin-bottom: 20px; z-index: 2; }
    @media (max-width: 768px) { .glitch-title { font-size: 2.5rem; } }
    
    .subtitle { font-size: clamp(1.2rem, 4vw, 2rem); max-width: 700px; text-align: center; margin-bottom: 40px; opacity: 0.9; font-weight: 300; }
    
    .stats-container { display: flex; gap: clamp(20px, 5vw, 60px); margin-top: 60px; padding: 40px; background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); border-radius: 20px; z-index: 2; flex-wrap: wrap; justify-content: center; animation: slideUp 1s ease-out; }
    
    .stat { text-align: center; }
    .stat-value { font-size: clamp(2.5rem, 8vw, 4.5rem); font-weight: 700; background: var(--gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; display: block; margin-bottom: 10px; }
    .stat-label { font-size: 1rem; opacity: 0.8; }
    
    @keyframes slideUp { from { transform: translateY(50px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    @keyframes float { 0%, 100% { transform: translateX(0) translateY(0); } 25% { transform: translateX(-20px) translateY(-20px); } 75% { transform: translateX(20px) translateY(20px); } }
</style>
</head>
<body>
    <div class="particles">
        <div class="particle" style="left: 10%; animation-delay: 0s;"></div>
        <div class="particle" style="left: 30%; animation-delay: -5s;"></div>
        <div class="particle" style="left: 60%; animation-delay: -10s;"></div>
        <div class="particle" style="left: 85%; animation-delay: -15s;"></div>
    </div>
    
    <section class="hero">
        <h1 class="glitch-title" data-text="YEMENTIO" id="glitchText">YEMENTIO</h1>
        <p class="subtitle">Premium Cloud Hosting<br/>Where Innovation Meets Performance</p>
        
        <div class="stats-container">
            <div class="stat">
                <span class="stat-value">99.9%</span>
                <span class="stat-label">Uptime Guarantee</span>
            </div>
            <div class="stat">
                <span class="stat-value">&lt;50ms</span>
                <span class="stat-label">Global CDN Speed</span>
            </div>
            <div class="stat">
                <span class="stat-value">24/7</span>
                <span class="stat-label">Expert Support</span>
            </div>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <script>
        function initAnimations() {
            gsap.to('.glitch-title', { opacity: 1, duration: 1.5, delay: 0.5 });
            
            const letters = document.querySelectorAll('#glitchText');
            letters.forEach(letter => {
                if (letter.classList.contains('glitch-effect')) return;
                
                letter.style.position = 'relative';
                letter.style.overflow = 'hidden';
                
                function applyGlitch(el, amount = 2) {
                    let iteration = 0;
                    const intervalId = setInterval(() => {
                        iteration += 1;
                        if (iteration % 3 === 0) {
                            el.style.transform = `translate(${Math.random() * amount - amount/2}px, ${Math.random() * amount - amount/2}px)`;
                            el.classList.remove('glitch-effect');
                        } else if (iteration % 5 === 0) {
                            el.style.filter = `hue-rotate(${Math.random() * 360}deg)`;
                            el.classList.add('glitch-effect');
                        }
                    }, 1);
                    
                    setTimeout(() => clearInterval(intervalId), 2000);
                }
                
                setInterval(() => {
                    applyGlitch(letter, Math.random() * 5 + 2);
                }, Math.random() * 500 + 1000);
            });
            
            gsap.from('.subtitle', { duration: 1.2, y: 30, opacity: 0, stagger: 0.2 });
            gsap.from('.stats-container', { duration: 0.8, y: 50, delay: 1, opacity: 0 });
            
            const particles = document.querySelectorAll('.particle');
            particles.forEach((particle, i) => {
                gsap.to(particle, { 
                    animation: `float${i}`, 
                    delay: -i * 5,
                    duration: getRandomFloat(8, 20),
                    repeat: -1,
                    yoyo: true,
                    ease: 'power1.inOut'
                });
            });
        }

        function getRandomFloat(min, max) {
            return Math.random() * (max - min) + min;
        }
        
        document.querySelector('.particle')?.classList.add('animate');
        initAnimations();
    </script>
</body>
</html>
