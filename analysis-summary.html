<style>*{margin:0;padding:0;box-sizing:border-box} body{font-family:system-ui,-apple-system,sans-serif;line-height:1.6;color:#1e293b;background:white}.hero-section{padding:12rem 1.5rem 8rem;background:linear-gradient(180deg,#eff6ff,#dbeafe);position:relative;overflow:hidden;text-align:center} .hero-pattern{content:"""content":"";position:absolute;top:-30%;left:0;width:100%;height:calc(100% +4rem);background:conic-gradient(from 0deg,rgba(99,102,241,.04),transparent 60%,rgba(231,79,58,.04));animation:pattern-move 60s linear infinite}@keyframes pattern-move{to{transform:rotate(360deg)}} .hero h1{margin:1rem auto;font-size:clamp(2.2rem,5vw,4rem);background:linear-gradient(to right,#4f46e5,#8b5cf6,#ec4899,-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:-1px} .hero p{color:#64748b;font-size:1.2rem;margin-top:1.5rem;} .cta-button{display:inline-flex;background:#4f46e5;color:white;padding:.8rem 2rem;border-radius:9999px;text-decoration:none;font-weight:600;margin:auto;transition:.3s;font-size:1.1rem;box-shadow:0 4px 15px rgba(79,70,229,.3);align-items:center} .cta-button:hover{background:#4338ca;transform:translateY(-3px);} features grid{display:grid;gap:2rem;max-width:1200px;margin:auto;padding:2rem 1.5rem} feature-card{background:white;border-radius:16px;padding:3rem;transition:.3s;box-shadow:0 4px 15px rgba(0,0,0,.08);border:1px solid #e2e8f0;text-align:center} .feature-card:hover{transform:translateY(-8px);box-shadow:0 20px 40px rgba(99,102,241,.1);border-color:#6366f1} .features h2{color:#475569;margin-bottom:.5rem;font-size:1.3rem}.pricing-section{background:#f8fafc;padding:6rem 1.5rem;text-align:center} section h1{font-size:clamp(1.8rem, 4vw, 3rem);color:#1e293b;margin-bottom:.5rem} .pricing-grid{display:grid;gap:2rem;max-width:1000px;margin:auto;padding-top:3rem} .plan-card{background:white;padding:2.5rem;border-radius:16px;text-align:center;border:2px solid #e2e8f0;transition:.3s}.plan-card:hover{border-color:#4f46e5;transform:translateY(-4px)} .plan-name{font-size:1.5rem;color:#475569;margin-bottom:.3rem;} .price{color:var(--primary);font-size:2.5rem;font-weight:800;} .features h2{color:#4f46e5;margin-bottom:.5rem;font-size:1.3rem}
footer{text-align:center;padding:3rem;color:#64748b;background:linear-gradient(180deg,#1e293b,#0f172a);margin-top:auto}
