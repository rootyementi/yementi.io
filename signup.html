<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - Yementi Portal</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
        
        body { 
            background: #f0f2f5; /* Facebook light gray */
            min-height: 100vh; padding: 40px 20px; display: flex; align-items: center; justify-content: center; 
        }

        .signup-container { 
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 12px rgba(0,0,0,.1);
            padding: 35px 25px; max-width: 520px; width: 100%; 
        }

        .logo { font-size: 28px; margin-bottom: 16px; color: #1877f2; font-weight: bold; text-align: center; }
        
        h2 { color: #050505; margin-bottom: 12px; font-size: 24px; text-align: center; }
        
        .subtitle { color: #636363; text-align: center; margin-bottom: 25px; line-height: 1.6; font-size: 14px; }

        .form-group { margin-bottom: 20px; }
        
        label { display: block; color: #050505; font-weight: 600; margin-bottom: 6px; font-size: 14px; }
        
        input { 
            width: 100%; padding: 14px 18px; border: 1px solid #dddfe2; 
            border-radius: 6px; font-size: 14px; outline: none; transition: all .2s ease; background: white;
        }

        input:focus { border-color: #1877f2; box-shadow: 0 0 0 3px rgba(24,119,242,.2); }
        
        .password-toggle { float: right; color: #60606a; cursor: pointer; user-select: none; font-size: 14px; }
        
        .checkbox-group { display: flex; align-items: flex-start; gap: 10px; font-size: 12px; color: #636363; margin-bottom: 20px; }
        .checkbox-group input { width: auto; cursor: pointer; }
        .checkbox-group label { display: inline; color: #636363; cursor: pointer; transition: all .2s ease; padding: 4px; border-radius: 4px; }
        .checkbox-group:hover label { background: #f2f2f5; }

        .btn { width: 100%; padding: 14px; background: #1877f2; color: white; border: none; border-radius: 6px; font-size: 15px; font-weight: 600; cursor: pointer; transition: all .2s ease; margin-top: 8px; }
        .btn:hover { background: #166fe5; }

        .links-container { display: flex; justify-content: space-between; margin-top: 15px; font-size: 13px; }
        
        .links-container a { color: #1877f2; text-decoration: none; transition: all .2s; padding: 4px; border-radius: 4px; background: rgba(24,119,242,.08); }
        .links-container a:hover { background: rgba(24,119,242,.16); }

        .features-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 20px; text-align: left; }
        
        .feature-box { background: white; border-radius: 6px; padding: 14px 10px; border-left: 3px solid #1877f2; }
        .feature-box h4 { color: #050505; font-size: 13px; margin-bottom: 5px; }
        .feature-box p { font-size: 11px; color: #636363; line-height: 1.4;}

    </style>
</head>
<body>
    <div class="signup-container">
        
        <div class="logo">💎 Yementi Portal</div>
        
        <h2>Create Your Account</h2>
        <p class="subtitle">Join our AI-powered web hosting platform and get started with GPU-accelerated website generation, automated backups, and professional tools.</p>
        
        <form onsubmit="alert('Demo: Account created! Redirecting to dashboard...'); return false;">
            
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="john@example.com" required>
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Create a strong password (min 8 characters)" minlength="8" required>
                <span class="password-toggle" onclick="togglePassword('password')">👁️</span>
            </div>
            
            <div class="form-group">
                <label for="confirm_password">Confirm Password</label>
                <input type="password" id="confirm_password" name="confirm_password" placeholder="Re-enter your password" required>
            </div>
            
            <div class="form-group">
                <label for="username">Choose Username</label>
                <input type="text" id="username" name="username" placeholder="john_doe (3-30 characters)" pattern="[a-zA-Z0-9_]+" maxlength="30" required>
            </div>
            
            <div class="form-group">
                <label for="company">Company/Organization Name</label>
                <input type="text" id="company" name="company" placeholder="Your business or personal brand" required>
            </div>
            
            <div class="checkbox-group">
                <input type="checkbox" id="terms" name="terms" checked required>
                <label for="terms">I agree to the <a href="#" style="color: #1877f2;">Terms of Service</a> and <a href="#" style="color: #1877f2;">Privacy Policy</a>.</label>
            </div>
            
            <button type="submit" class="btn">Create Account →</button>
        </form>

        <div class="links-container">
            <a href="#">Already have an account? Sign In</a>
            <a href="#">Forgot Password?</a>
        </div>

    </div>

    <script>
        function togglePassword(id) {
            const passwordField = document.getElementById(id);
            if (passwordField.type === 'password') {
                passwordField.type = 'text';
            } else {
                passwordField.type = 'password';
            }
        }

        // Validate passwords match
        document.addEventListener('input', function() {
            const pass1 = document.getElementById('password').value;
            const pass2 = document.getElementById('confirm_password').value;
            
            if (pass2 && pass1 !== pass2) {
                alert('Passwords do not match!');
            }
        });
    </script>

    <footer style="margin-top:25px;padding:12px 0;border-top:1px solid #dddfe2;box-sizing:border-box;">
        <p style="font-size:12px;color:#8E8E93;">&copy; 2026 Yementi.io - All rights reserved.</p>
    </footer>

</body>
</html>
